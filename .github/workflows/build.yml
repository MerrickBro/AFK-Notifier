name: Build

on:
  push:
    branches:
      - main
      - initial-build
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AFK-Notifier.sln

      - name: Build
        run: dotnet build AFK-Notifier.sln --configuration Release --no-restore
